# LAN Media Receiver configuration (example)
#
# Real config lives at ~/.config/lanmedia/receiver.conf and is normally written
# by the settings GUI (lanmedia-receiver-settings). You can also copy this file
# there and edit by hand. All keys are optional; missing ones use defaults.

# Name the sender uses to find this panel over UDP discovery.
name=Rcvr-482

# TCP media port (must match the sender). Default 45788.
port=45788

# Requested playout buffer in milliseconds (20–500).
# The effective value is raised to the stream's frame-rate floor automatically:
# 40 ms at 30 fps, 20 ms at 60 fps. Lower = less latency, needs wired Ethernet.
buffer_ms=150

# Optional password. Leave blank for an open receiver. Must match the sender.
password=

# 1 = require TLS (self-signed cert, pinned by the sender on first connect).
# Must match the sender's "Encrypt connection" checkbox.
use_tls=1

# 1 = fullscreen video window, 0 = windowed (handy while testing).
fullscreen=1

# H.264 decode path:
#   auto      try GPU (VAAPI); fall back to software automatically  (recommended)
#   hardware  prefer GPU; still falls back to software if it fails
#   software  always decode on the CPU
# On weak CPUs (old Chromebooks/Atom), GPU decode may be needed for smooth 1080p;
# run `vainfo` to see if the GPU exposes H.264 (VAProfileH264* + VAEntrypointVLD).
decoder=auto
